{# Post listing component. The caller sets `posts` first:
   {% set posts = term_pages %}  or  {% set posts = pagination.items %} #}
<ol class="post-list">
{% for post in posts %}
  <li class="post-list__item">
    <time datetime="{{ post.date }}" class="post-list__date">{{ post.date }}</time>
    <h2 class="post-list__title"><a href="{{ post.url }}">{{ post.title }}</a></h2>
    {% if post.description %}<p class="post-list__excerpt">{{ post.description }}</p>{% endif %}
  </li>
{% endfor %}
</ol>
