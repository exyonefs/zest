# Zest site configuration.
#
# [site]       → metadata surfaced to templates as `site.*`
# [pagination] → how many entries each listing page shows
#
# Everything here is optional: delete this file and the site still builds.

[site]
title = "My Zest Blog"
description = "A flat, minimal static blog: one HTML file per page, one stylesheet, no runtime dependencies."
url = "https://example.com"
author = "Zest User"
language = "en"

[pagination]
per_page = 5
